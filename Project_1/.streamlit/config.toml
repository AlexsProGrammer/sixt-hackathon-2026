[theme]
base = "light"
primaryColor = "#FF5F00"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans-serif"
borderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "0.75rem"

[theme.sidebar]
backgroundColor = "#FFFFFF"

[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
